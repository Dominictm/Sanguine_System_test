name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit-integration-e2e:
    name: Unit + API + E2E
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: npm install

      - name: Unit + integration + E2E
        # Cross-platform spec reporter (no custom HTML reporter / nul device).
        run: npm run test:ci

  ui-selenium:
    name: UI (Selenium + Chrome)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # selenium-webdriver — devDependency в web/package.json, ставится этим же
      # шагом; chromedriver подтягивает встроенный Selenium Manager (4.x), Chrome
      # предустановлен на образе windows-latest — отдельных шагов не нужно.
      - name: Install web dependencies
        run: npm install

      - name: UI tests (headless Chrome)
        env:
          HEADLESS: '1'
        run: npm run test:ui

  data-integrity:
    name: Cards + links validators
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate character/location cards (strict)
        run: node system/schema/validate_cards.js --strict

      - name: Validate internal links
        shell: pwsh
        run: ./tools/validate_links.ps1 -Force -Quiet

# NOTE: Selenium UI tests раньше сюда не входили («require a real Chrome browser»),
# из-за чего молча разошлись с интерфейсом — на 2026-08-11 падало 5 из 59, включая
# селекторы вкладок, удалённых ещё 2026-08-07. Теперь они в CI (job ui-selenium
# выше). Локальный прогон — той же командой: `HEADLESS=1 npm run test:ui`.
